<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Image processor</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      html, body { margin: 0; height: 100%; background: #1a1626; color: #ededf5; }
      body { display: flex; flex-direction: column; }
      header {
        padding: 14px 18px;
        border-bottom: 1px solid rgba(168, 85, 247, 0.25);
        font-size: 12px;
        color: #c084fc;
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 24px;
      }
      .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed rgba(168, 85, 247, 0.15); font-size: 13px; }
      .row strong { color: #c084fc; }
      .note { font-size: 11px; color: #8888a8; margin-top: 16px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <header>Image processor — info panel</header>
    <main>
      <div class="row"><span>Status</span><strong>running</strong></div>
      <div class="row"><span>Loaded by</span><strong id="origin">—</strong></div>
      <div class="row"><span>Activated at</span><strong id="ts">—</strong></div>
      <p class="note">
        Standalone-tool plugins talk to the host over a separate gRPC
        channel. The host can push <code>views.postMessage</code> to this
        panel; tool ← panel routing isn't wired in v1.
      </p>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
